@if (isLoading) {
  <div class="loading-screen flex items-center justify-center bg-slate-50 min-h-screen" [class.fade-out]="isFading">
    <div class="w-16 h-16 border-4 border-slate-200 border-t-primary rounded-full animate-spin"></div>
  </div>
}

<div class="main-content" [hidden]="!isFading && isLoading">
  <router-outlet></router-outlet>
</div>
