@if (isLoading) {
  <div class="loading-screen" [class.fade-out]="isFading">
    <video #splashVideo autoplay [muted]="true" loop playsinline class="logo-loader">
      <source src="videos/logo.mp4" type="video/mp4" />
    </video>
  </div>
}

<div class="main-content" [hidden]="!isFading && isLoading">
  <router-outlet></router-outlet>
</div>
