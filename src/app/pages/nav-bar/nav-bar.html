<div class="navbar w-full bg-white shadow-sm border-b border-gray-100 px-2 md:px-4 py-1 font-cairo">
  <nav class="max-w-3xl md:max-w-5xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-1.5">
      <a routerLink="home" class="flex items-center gap-1.5">
        <div class="text-right">
          <div class="flex items-center gap-1">
            <span class="text-xl font-black text-[#112a2a] tracking-tight">
              <img src="images/logo2.jpg" alt="jj" class="w-30" />
            </span>
          </div>
        </div>
      </a>
    </div>

    <div class="flex items-center gap-3">
      <a
        routerLink="/home"
        routerLinkActive=""
        class="text-[#112a2a] font-bold text-sm hover:text-[#2da5a2] transition-colors"
      >
        الرئيسية
      </a>

      @if (!isLogin) {
        <a
          routerLink="/login"
          routerLinkActive="gradent text-white"
          class="text-[#112a2a] font-bold text-sm hover:text-[#2da5a2] transition-colors cursor-pointer"
        >
          تسجيل الدخول
        </a>

        <a
          routerLink="/register"
          class="gradent px-3 py-1.5 rounded-md font-bold text-sm hover:opacity-90 transition-opacity shadow-sm hidden sm:block cursor-pointer"
        >
          إنشاء حساب
        </a>

      } @else {
        <span
          (click)="logout()"
          class="gradent px-3 py-1.5 rounded-md font-bold text-sm hover:opacity-90 transition-opacity shadow-sm hidden sm:block cursor-pointer"
        >
          الخروج
        </span>
      }
    </div>
  </nav>
</div>
