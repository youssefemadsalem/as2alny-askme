<div class="max-w-4xl mx-auto mt-20 p-6 bg-white rounded-2xl shadow-sm">

  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
    تقييم الخدمات الحكومية
  </h2>

  <!-- اختيار الخدمة -->
  <select
    [(ngModel)]="selectedService"
    class="w-full border rounded-lg p-3 mb-5 focus:outline-none focus:ring focus:ring-green-200"
  >
    <option value="">اختر الخدمة</option>
    <option *ngFor="let s of services" [value]="s">
      {{ s }}
    </option>
  </select>

  <!-- النجوم -->
  <div class="flex justify-center gap-2 mb-5">
    <button
      *ngFor="let star of stars"
      (click)="setRating(star)"
      class="text-3xl transition"
      [class.text-yellow-400]="star <= rating"
      [class.text-gray-300]="star > rating"
    >
      ★
    </button>
  </div>

  <!-- التعليق -->
  <textarea
    [(ngModel)]="comment"
    rows="4"
    placeholder="اكتب رأيك أو تجربتك..."
    class="w-full border rounded-lg p-3 mb-5 focus:outline-none focus:ring focus:ring-green-200"
  ></textarea>

  <!-- إرسال -->
  <button
    (click)="submitRating()"
    class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition"
  >
    إرسال التقييم
  </button>

</div>

<!-- عرض التقييمات -->
<div class="max-w-4xl mx-auto mt-10 space-y-4">

  <div
    *ngFor="let r of ratings"
    class="bg-white p-4 rounded-xl shadow-sm border"
  >
    <div class="flex justify-between mb-2">
      <span class="font-semibold text-green-700">
        {{ r.service }}
      </span>
      <span class="text-yellow-400">
        {{ '★'.repeat(r.stars) }}
      </span>
    </div>

    <p class="text-gray-600">
      {{ r.comment }}
    </p>
  </div>

</div>
