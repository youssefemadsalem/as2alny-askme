<style>
  .min-h-screen {
    position: relative;
    overflow: hidden;
  }

  .min-h-screen::before,
  .min-h-screen::after {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(30px);
    z-index: 0;
    opacity: 0.4;
  }

  .min-h-screen::before {
    background: radial-gradient(circle, var(--color-primary, #3b82f6), transparent);
    top: -10%;
    left: -10%;
  }

  .min-h-screen::after {
    background: radial-gradient(circle, var(--color-accent, #10b981), transparent);
    bottom: -10%;
    right: -10%;
  }

  /* Adjusted blob sizes for the smaller card */
  .max-w-2xl::before,
  .max-w-2xl::after {
    content: '';
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    z-index: -1;
  }

  .max-w-2xl::before {
    background: var(--color-secondary, #1e293b);
    top: -20px;
    right: -20px;
  }

  .max-w-2xl::after {
    background: var(--color-primary, #3b82f6);
    bottom: -20px;
    left: -20px;
  }
</style>

<div
  class="from-slate-50 via-accent/5 to-primary/5 flex items-center justify-center p-4 font-cairo h-screen"
  dir="rtl"
>
  <div
    class="relative w-full max-w-2xl bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)] border border-white flex flex-col overflow-hidden"
  >
    <div class="w-full p-8 md:p-12 flex flex-col justify-center">
      <div class="mb-10 text-center">
        <h2 class="text-3xl md:text-4xl font-extrabold text-secondary mb-3">طلب إضافة خدمة</h2>
        <p class="text-slate-500 text-lg font-medium">
          لم تجد ما تبحث عنه؟ املأ البيانات وسنقوم بإضافتها
        </p>
      </div>

      <form class="space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="space-y-2">
          <label class="block text-sm font-bold text-secondary pr-2">اسم الخدمة المطلوبة</label>
          <input
            type="text"
            formControlName="serviceName"
            placeholder="مثال: تجديد رخصة قيادة"
            class="w-full px-5 py-4 rounded-2xl border border-slate-200 bg-white/50 focus:bg-white focus:ring-4 focus:ring-accent/10 focus:border-accent outline-none transition-all placeholder:text-slate-300 text-right text-secondary"
          />

          @if (form.get('serviceName')?.invalid && form.get('serviceName')?.touched) {
            <p class="text-rose-500 text-xs font-bold pr-2 flex items-center gap-1">
              <i class="fa-solid fa-circle-exclamation"></i>
              الرجاء إدخال اسم الخدمة المطلوبة
            </p>
          }
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-bold text-secondary pr-2">وصف الخدمة</label>
          <textarea
            formControlName="description"
            rows="4"
            placeholder="اشرح لنا تفاصيل أكثر عن الخدمة التي تحتاجها..."
            class="w-full px-5 py-4 rounded-2xl border border-slate-200 bg-white/50 focus:bg-white focus:ring-4 focus:ring-accent/10 focus:border-accent outline-none transition-all placeholder:text-slate-300 text-right text-secondary resize-none"
          ></textarea>
        </div>

        <button
          [disabled]="form.invalid"
          [class.animate-gradient-x]="isLoading()"
          class="w-full py-4 mt-4 text-white font-bold text-lg rounded-2xl shadow-xl bg-linear-to-l from-secondary via-accent to-primary hover:shadow-accent/30 hover:scale-[1.01] active:scale-[0.98] transition-all cursor-pointer disabled:grayscale-75 disabled:pointer-events-none"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <svg
                class="animate-spin h-5 w-5 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              جاري الإرسال...
            </span>
          } @else {
            إرسال الطلب
          }
        </button>
      </form>

      <div class="mt-10 text-center border-t border-slate-100 pt-6">
        <p class="text-slate-400 text-sm font-medium italic">
          بلدك بين إيدك.. تكنولوجيا مصرية لخدمة المصريين
        </p>
      </div>
    </div>
  </div>
</div>
