<div class="">
  <!-- Requests Title -->
  <div class="mb-6 pr-2">
    <h3 class="text-2xl font-bold text-secondary">طلباتي :</h3>
  </div>

  <!-- Table -->
  <div class="w-full">
    <table class="w-full text-right border-separate border-spacing-y-1.5 border-spacing-x-0">
      <thead>
        <tr class="bordr-b border-gray-200 gradent">
          <th class="py-4 pr-3 border-r border-transparent rounded-r-lg text-sm font-semibold">
            اسم الطلب
          </th>
          <th class="py-4 text-sm font-semibold">رقم الطلب</th>
          <th class="py-4 text-sm font-semibold">تاريخ التقديم</th>
          <th class="py-4 text-sm font-semibold border-l border-transparent rounded-l-lg">
            الحالة
          </th>
        </tr>
      </thead>
      <tbody>
        @for (req of requestList; track req._id; let i = $index) {
          <tr class="border-b border-gray-100 text-gray-700 hover:bg-gray-200 group">
            <!-- Request Name -->
            <td
              class="py-4 pr-2 border-2 border-transparent rounded-r-lg"
              [ngClass]="{ 'bg-gray-100 group-hover:bg-gray-200': i % 2 === 1 }"
            >
              <p class="text-base font-medium">
                {{ req.serviceName }}
              </p>
            </td>
            <!-- Request ID -->
            <td
              class="py-4 text-sm"
              [ngClass]="{ 'bg-gray-100 group-hover:bg-gray-200': i % 2 === 1 }"
              dir="ltr"
            >
              {{ req._id.substring(0, 8) }}
            </td>
            <!-- Request Date -->
            <td
              class="py-4 text-sm"
              [ngClass]="{ 'bg-gray-100 group-hover:bg-gray-200  ': i % 2 === 1 }"
            >
              {{ req.createdAt.substring(0, 10) }}
            </td>
            <!-- Request Status Badge -->
            <td
              class="py-4 border-4 border-transparent rounded-l-lg"
              [ngClass]="{ 'bg-gray-100 group-hover:bg-gray-200 ': i % 2 === 1 }"
            >
              <!-- get Status from the list and edit it's style according to the return of getStatusClass function    -->
              <span
                class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold"
                [ngClass]="getStatusClass(req.status)"
              >
                {{ getStatusLabel(req.status) }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center py-4 text-secondary">
              ليس لديك أي طلبات حتى الان !
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
