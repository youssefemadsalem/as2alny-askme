<style>
  .min-h-screen {
    position: relative;
    overflow-x: hidden;
  }

  /* Background Blobs - Exact copy from your code to maintain consistency */
  .min-h-screen::before,
  .min-h-screen::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    opacity: 0.5;
    pointer-events: none;
  }

  .min-h-screen::before {
    background: radial-gradient(circle, var(--color-primary, #3b82f6), transparent);
    top: -15%;
    left: -10%;
    animation: float 10s infinite ease-in-out;
  }

  .min-h-screen::after {
    background: radial-gradient(circle, var(--color-accent, #10b981), transparent);
    bottom: -15%;
    right: -10%;
    animation: float 12s infinite ease-in-out reverse;
  }

  @keyframes float {
    0% {
      transform: translate(0, 0);
    }
    50% {
      transform: translate(30px, 30px);
    }
    100% {
      transform: translate(0, 0);
    }
  }
</style>

<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-cairo" dir="rtl">
  <div
